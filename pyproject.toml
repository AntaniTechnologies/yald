[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yald"
version = "1.3.0"
description = "Yet Another Llama Dashboard - real-time terminal UI for llama-server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "rich",
    "requests",
]

[project.scripts]
yald = "yald:main"
